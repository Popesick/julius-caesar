<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julius Caesar – Gallischer Krieg</title>
<style>
  :root {
    --bg: #1a1511; --panel: #261f19; --panel2: #302820; --line: #4a3d30; --ink: #f0e6d2; --mute: #a99a82;
    --gold: #d1a94f; --sea: #172a33; --land: #4a4032; --land2: #5b4e3b;
    --hostile: #c0463c; --free: #d9a441; --peace: #5fa05f; --ally: #4f86c9; --dead: #6c6c6c;
    --g0: #b07ad9; --g1: #efe6cf; --g2: #e8883a; --g3: #43b8a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #7a5a1c; border-color: var(--gold); }
  button.danger { background: #6b2a25; border-color: #a24238; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  input[type=number], select { font: inherit; background: #15110e; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; width: 100%; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .04em; color: var(--gold); font-weight: 650; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 14px; white-space: nowrap; }
  .chip b { color: var(--gold); font-variant-numeric: tabular-nums; }
  .tools { display: flex; gap: 6px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; padding: 12px; height: calc(100% - 58px); }
  .mapwrap { background: var(--sea); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 0; position: relative; }
  svg#map { width: 100%; height: 100%; display: block; }
  .land { fill: var(--land); stroke: #7a6a50; stroke-width: .35; stroke-linejoin: round; }
  .lager { fill: none; stroke: var(--mute); stroke-width: .3; stroke-dasharray: 1 .7; }
  .tribe { cursor: pointer; }
  .tribe circle.body { stroke-width: .55; transition: fill .2s; }
  .tribe:focus { outline: none; }
  .tribe.sel circle.halo, .tribe:focus-visible circle.halo { opacity: 1; }
  .tribe circle.halo { fill: none; stroke: #fff; stroke-width: .35; opacity: 0; }
  .tribe text { font-size: 1.45px; fill: var(--ink); paint-order: stroke; stroke: #14100c; stroke-width: .45px; text-anchor: middle; pointer-events: none; }
  .legion rect { fill: #8b1f1a; stroke: var(--gold); stroke-width: .25; }
  .legion text { font-size: 1.5px; fill: #fff; text-anchor: middle; font-weight: 700; pointer-events: none; }
  .legion.dead rect { fill: #444; }
  .legion.act rect { stroke: #fff; stroke-width: .45; }
  .legend { position: absolute; left: 10px; bottom: 10px; background: rgba(20,16,12,.82); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 12.5px; display: grid; grid-template-columns: repeat(4, auto); gap: 3px 14px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h2 { margin: 0 0 6px; font-size: 16px; color: var(--gold); }
  .card h3 { margin: 10px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0; }
  dt { color: var(--mute); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; background: #15110e; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; background: var(--gold); }
  .bar.red i { background: var(--hostile); } .bar.blue i { background: var(--ally); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .row > button { flex: 1 1 auto; }
  .legions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lg { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 13px; }
  .lg b { color: var(--gold); }
  #log { font-size: 13px; color: var(--mute); max-height: 150px; overflow: auto; margin: 0; padding-left: 18px; }
  #log li { margin: 2px 0; }
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--gold); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .dlg { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 26px); overflow: auto; }
  .pic { width: 100%; height: 190px; object-fit: cover; object-position: center 18%; border-radius: 10px; display: block; margin: -4px 0 2px; background: #15110e; }
  .pic.wide { object-position: center 40%; height: 200px; }
  .dlg h2 { margin: 0; color: var(--gold); font-size: 19px; }
  .dlg p { margin: 0; }
  .dlg .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
  .opt { display: flex; flex-direction: column; gap: 6px; }
  .opt button { text-align: left; }
  .hint { color: var(--mute); font-size: 13px; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; text-align: center; }
  .vs .n { font-size: 24px; font-variant-numeric: tabular-nums; }
  .vs .nm { font-size: 13px; color: var(--mute); }
  .good { color: #8fd18f; } .bad { color: #f08a80; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    .mapwrap { height: auto; min-height: 0; }
    svg#map { height: auto; aspect-ratio: 82 / 74; }
    .legend { position: static; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; grid-template-columns: repeat(4, auto); justify-content: space-between; }
    body { overflow: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>Julius Caesar · Gallien</h1>
  <div class="chips" aria-live="polite">
    <span class="chip">Jahr <b id="cYear">1</b></span>
    <span class="chip">Vermögen <b id="cMoney">0</b> Denare</span>
    <span class="chip">Befriedet <b id="cPac">0</b>/30</span>
    <span class="chip">Stärke <b id="cSp">1</b></span>
  </div>
  <div class="tools">
    <button id="bMusic" aria-pressed="true" title="Musik (Platzhalter)">♪</button>
    <button id="bHelp">Regeln</button>
    <button id="bSave">Speichern</button>
    <button id="bNew">Neu</button>
  </div>
</header>
<main>
  <div class="mapwrap">
    <svg id="map" viewBox="-6 -4 82 74" role="img" aria-label="Karte Galliens mit 30 Stämmen"></svg>
    <div class="legend" aria-hidden="true">
      <span><i style="background:var(--hostile)"></i>im Krieg</span><span><i style="background:var(--free)"></i>frei</span>
      <span><i style="background:var(--peace)"></i>Frieden</span><span><i style="background:var(--ally)"></i>Freundschaft</span>
      <span><i style="background:var(--g0)"></i>Belger</span><span><i style="background:var(--g1)"></i>Gallier</span>
      <span><i style="background:var(--g2)"></i>Aquitaner</span><span><i style="background:var(--g3)"></i>Volcer</span>
    </div>
  </div>
  <aside>
    <section class="card" id="tribeCard"></section>
    <section class="card"><h2>Legionen</h2><div class="legions" id="legions"></div>
      <div class="row"><button id="bWinter" class="primary">Winterlager beziehen (Jahr beenden)</button></div></section>
    <section class="card"><h2>Chronik</h2><ol id="log" reversed></ol></section>
  </aside>
</main>
<dialog id="dlg"></dialog>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="music.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const nf = n => Math.round(n).toLocaleString('de-DE');
const ROMAN = ['', 'I', 'II', 'III', 'IV'];
let G = null, sel = 0, actLegion = 1, busy = false;
const SAVE_KEY = 'julius-caesar-remake-v1';
const SP_TEXT = {
  1: 'Normal: Startwerte wie in den Daten, 1 Unruheherd pro Jahr.',
  2: 'Alle Stämme starten 1 Haltung schlechter, 2 Unruheherde pro Jahr.',
  3: 'Legionen nur 2500 Mann stark, 3 Unruheherde pro Jahr.',
  4: 'Nur 8000 Denare Startkapital, Haltung −1, 4 Unruheherde pro Jahr.',
  5: 'Zufällige Haltungen, 50 000 Denare, aber 5 Unruheherde pro Jahr.',
};

/* ---------- Dialoge ---------- */
const dlg = $('#dlg');
dlg.addEventListener('cancel', e => e.preventDefault());
const pic = (n, cls = '') => n ? `<img class="pic ${cls}" src="assets/${n}.jpg" alt="" onerror="this.remove()">` : '';
function ask({ title, html = '', img = '', buttons = [{ label: 'Weiter', value: true, cls: 'primary' }], mount }) {
  return new Promise(res => {
    dlg.innerHTML = `<div class="dlg">${pic(img, img === 'titel' || img === 'sieg' ? 'wide' : '')}<h2></h2><div class="body">${html}</div><div class="btns"></div></div>`;
    dlg.querySelector('h2').textContent = title;
    const bar = dlg.querySelector('.btns');
    const api = { el: dlg, close: v => { dlg.close(); res(v); } };
    for (const b of buttons) {
      const btn = document.createElement('button'); btn.textContent = b.label; if (b.cls) btn.className = b.cls;
      btn.disabled = !!b.disabled; btn.addEventListener('click', () => api.close(typeof b.value === 'function' ? b.value(dlg) : b.value));
      bar.append(btn);
    }
    if (mount) mount(api);
    if (!dlg.open) dlg.showModal();
    const first = dlg.querySelector('input, .btns button:last-child'); if (first) first.focus();
  });
}
const note = (title, html, label = 'Weiter', img = '') => ask({ title, html, img, buttons: [{ label, value: true, cls: 'primary' }] });
function askNumber({ title, html, img = '', min = 0, max, value = 0, label = 'Bestätigen', unit = '' }) {
  return ask({
    title, img, html: `${html}<label class="hint">Menge${unit ? ' (' + unit + ')' : ''}: 0 – ${nf(max)}<input type="number" id="num" min="${min}" max="${max}" step="1" value="${Math.min(value, max)}"></label>
      <div class="row"><button type="button" data-v="0">0</button><button type="button" data-v="${Math.floor(max / 2)}">½</button><button type="button" data-v="${max}">Max</button></div>`,
    buttons: [{ label, value: d => Math.max(min, Math.min(max, Math.floor(+d.querySelector('#num').value || 0))), cls: 'primary' }],
    mount: api => api.el.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => { api.el.querySelector('#num').value = b.dataset.v; })),
  });
}

/* ---------- Karte ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svg = $('#map');
const mk = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
const GCOL = ['var(--g0)', 'var(--g1)', 'var(--g2)', 'var(--g3)'];
function buildMap() {
  svg.innerHTML = '';
  mk('polygon', { class: 'land', points: '4,12 12,9 22,5 34,3 44,0 56,2 66,6 71,14 71,30 69,40 63,48 59,56 55,62 47,66 36,66 24,62 14,60 8,56 3,52 0,44 2,34 0,24 2,16' }, svg);
  mk('rect', { class: 'lager', x: 61.5, y: 56.5, width: 8, height: 7, rx: 1 }, svg);
  const lt = mk('text', { x: 65.5, y: 66, 'font-size': 1.5, fill: 'var(--mute)', 'text-anchor': 'middle' }, svg); lt.textContent = 'Provincia · Lager';
  for (const t of G.tribes.slice(1)) {
    const g = mk('g', { class: 'tribe', tabindex: 0, role: 'button', 'data-id': t.id, 'aria-label': t.name }, svg);
    const r = 1.2 + 1.9 * Math.sqrt(JC_POP[t.id] / 256230);
    mk('circle', { class: 'halo', cx: t.x, cy: t.y, r: r + 1 }, g);
    mk('circle', { class: 'body', cx: t.x, cy: t.y, r, stroke: GCOL[t.group] }, g);
    const tx = mk('text', { x: t.x, y: t.y + r + 1.9 }, g); tx.textContent = t.name;
    g.addEventListener('click', () => select(t.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(t.id); } });
  }
  mk('g', { id: 'legionLayer' }, svg);
}
const JC_POP = {}; TRIBES.forEach(t => JC_POP[t.id] = t.pop);
function tribeState(t) { return t.ex ? 'dead' : t.vt === 2 ? 'ally' : t.vt === 1 ? 'peace' : t.br === 0 ? 'hostile' : 'free'; }
const STATE_LABEL = { dead: 'vernichtet', ally: 'Freundschaftsvertrag', peace: 'Friedensvertrag', hostile: 'im Krieg mit Rom', free: 'frei' };
function renderMap() {
  svg.querySelectorAll('.tribe').forEach(g => {
    const t = G.tribes[+g.dataset.id], st = tribeState(t);
    g.querySelector('.body').setAttribute('fill', `var(--${st === 'dead' ? 'dead' : st})`);
    g.classList.toggle('sel', t.id === sel);
    g.setAttribute('aria-label', `${t.name}, ${STATE_LABEL[st]}`);
  });
  const layer = $('#legionLayer'); layer.innerHTML = '';
  const byPos = {};
  for (let i = 1; i <= 4; i++) { const L = G.legions[i], k = L.x + ',' + L.y; (byPos[k] = byPos[k] || []).push(i); }
  for (const k in byPos) {
    const arr = byPos[k], [x, y] = k.split(',').map(Number);
    arr.forEach((i, n) => {
      const L = G.legions[i], g = mk('g', { class: 'legion' + (L.le ? '' : ' dead') + (i === actLegion ? ' act' : '') }, layer);
      const cx = x + (n - (arr.length - 1) / 2) * 2.1, cy = y - 3.1;
      mk('rect', { x: cx - 0.95, y: cy - 0.95, width: 1.9, height: 1.9, rx: .3 }, g);
      mk('text', { x: cx, y: cy + .55 }, g).textContent = ROMAN[i];
    });
  }
}

/* ---------- Seitenleiste ---------- */
function bar(v, max, cls = '') { return `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, v / max * 100))}%"></i></div>`; }
function renderSide() {
  $('#cYear').textContent = G.year; $('#cMoney').textContent = nf(G.rv); $('#cPac').textContent = JC.pacified(G); $('#cSp').textContent = G.sp;
  const lg = $('#legions'); lg.innerHTML = '';
  for (let i = 1; i <= 4; i++) {
    const L = G.legions[i], d = document.createElement('div'); d.className = 'lg';
    d.innerHTML = `<b>${ROMAN[i]}. Legion</b>${i === actLegion ? ' ◂' : ''}<br>${nf(L.le)} Mann ${bar(L.le, JC.MAX_LEGION)}Moral ${L.mv}/9 · ${L.sl}/${L.kl} Siege<br><span class="hint">${L.at ? G.tribes[L.at].name : 'Lager'}</span>`;
    d.addEventListener('click', () => { actLegion = i; renderAll(); }); lg.append(d);
  }
  const c = $('#tribeCard');
  if (!sel) { c.innerHTML = '<h2>Stamm wählen</h2><p class="hint">Wähle einen Stamm auf der Karte, um Informationen zu sehen, zu verhandeln oder eine Legion zu entsenden.</p>'; return; }
  const t = G.tribes[sel], st = tribeState(t), nego = JC.canNegotiate(G, sel);
  const att = t.ex ? '–' : JC.attitudeLabel(t.br);
  c.innerHTML = `<h2>${t.name}</h2><div class="hint">${GROUPS[t.group]} · ${STATE_LABEL[st]}</div>
    ${t.ex ? '<p>Dieser Stamm wurde von Rom vernichtet.</p>' : `
    <dl><dt>Bevölkerung</dt><dd>${nf(t.be)}</dd><dt>Krieger</dt><dd>${nf(t.be / 5)}</dd>
    <dt>Haltung zu Rom</dt><dd>${att} (${t.br})</dd><dt>Geiseln in Rom</dt><dd>${nf(t.gr)}</dd>
    <dt>Tribut pro Jahr</dt><dd>${nf(t.tr)}</dd><dt>Kriege gegen Rom</dt><dd>${t.rk}</dd><dt>Röm. Niederlagen</dt><dd>${t.rk - t.rs}</dd>
    ${t.vt === 2 ? '<dt>Hilfstruppen</dt><dd>1000/Jahr</dd>' : ''}</dl>${bar(Math.min(t.br, 12), 12, t.br === 0 ? 'red' : t.br > 10 ? 'blue' : '')}`}
    <div class="row">
      <button id="bNego" ${t.ex || !nego || busy ? 'disabled' : ''}>Verhandeln (${5 - G.vx} übrig)</button>
    </div>
    <h3>Legion entsenden</h3>
    <div class="row">${[1, 2, 3, 4].map(i => `<button data-send="${i}" ${busy ? 'disabled' : ''}>${ROMAN[i]} · ${nf(G.legions[i].le)}</button>`).join('')}</div>`;
  const nb = $('#bNego'); if (nb) nb.onclick = () => negotiateFlow(sel);
  c.querySelectorAll('[data-send]').forEach(b => b.onclick = () => { actLegion = +b.dataset.send; sendLegion(+b.dataset.send, sel); });
}
function renderAll() { renderMap(); renderSide(); }
function log(s) { const li = document.createElement('li'); li.textContent = `Jahr ${G.year}: ${s}`; $('#log').prepend(li); while ($('#log').children.length > 60) $('#log').lastChild.remove(); }
function select(id) { if (busy) return; sel = id; renderAll(); }

/* ---------- Verhandlung ---------- */
async function negotiateFlow(x) {
  const t = G.tribes[x]; G.vs = 0;
  const opts = JC.negotiationOptions(G, x);
  const pick = await ask({
    title: `Verhandlung mit den ${t.name}`, img: 'caesar',
    html: `<p>Haltung: <b>${JC.attitudeLabel(t.br)}</b>. Dein Vermögen: <b>${nf(G.rv)}</b> Denare. Verhandlungen dieses Jahres: ${G.vx}/5.</p><div class="opt">${opts.map(o =>
      `<button data-sa="${o.sa}" ${o.ok ? '' : 'disabled'}>${o.label}</button>`).join('')}</div>`,
    buttons: [{ label: 'Keine Verhandlungen', value: 0 }],
    mount: api => api.el.querySelectorAll('[data-sa]').forEach(b => b.addEventListener('click', () => api.close(+b.dataset.sa))),
  });
  if (!pick) return;
  let amount = 0;
  if (pick === 2) { amount = await askNumber({ title: 'Geldzuwendung', html: `<p>Wie viele Denare schickst du den ${t.name}?</p>`, max: G.rv, label: 'Senden', unit: 'Denare' }); }
  const r = JC.negotiate(G, x, pick, amount);
  const msg = { 2: ['Höchst erfolgreich.', 'good'], 1: ['Erfolgreich.', 'good'], 0: ['Erfolglos.', ''], '-1': ['Katastrophal.', 'bad'] }[r.ef];
  log(`Verhandlung mit ${t.name}: ${msg[0].replace('.', '').toLowerCase()}`);
  await note(`Die Verhandlungen verliefen …`, `<p class="${msg[1]}"><b>${msg[0]}</b></p>`);
  renderAll();
}

/* ---------- Legion entsenden / Kampf ---------- */
async function sendLegion(y, x) {
  if (busy) return; busy = true; renderSide();
  try {
    const t = G.tribes[x], L = G.legions[y], chk = JC.attackCheck(G, y, x);
    if (!chk.ok) {
      const why = { destroyed: 'Diese Stadt ist schon vernichtet!', treaty: 'Du hast einen Friedensvertrag mit diesem Volk unterschrieben!', empty: `Die ${ROMAN[y]}. Legion hat keine Soldaten mehr.` }[chk.reason];
      JC.moveLegion(G, y, x); G.vs = 0; await note('Kein Angriff möglich', `<p>${why}</p><p class="hint">Die Legion bezieht Stellung bei den ${t.name}.</p>`); return;
    }
    const act = await ask({
      title: `${ROMAN[y]}. Legion vor der Stadt der ${t.name}`, img: 'legionaer',
      html: `<dl><dt>Bevölkerung</dt><dd>${nf(t.be)}</dd><dt>Krieger</dt><dd>${nf(G.vs === x ? G.ga : t.be / 5)}</dd><dt>Eigene Legion</dt><dd>${nf(L.le)} Mann</dd></dl>
        ${t.br > 3 ? `<p class="hint">Achtung: Der Angriff auf einen Stamm, der Rom nicht feindlich gesinnt ist, erzürnt seine Volksgruppe (${GROUPS[t.group]}).</p>` : ''}`,
      buttons: [{ label: 'Weiterziehen', value: 'move' }, { label: 'Angreifen', value: 'attack', cls: 'danger' }],
    });
    if (act === 'move') { JC.moveLegion(G, y, x); G.vs = 0; log(`${ROMAN[y]}. Legion bei den ${t.name}`); return; }
    await battle(y, x);
  } finally { busy = false; renderAll(); if (G.over !== 'win') Music.play('map'); }
}

async function battle(y, x) {
  const t = G.tribes[x]; Music.play('battle');
  const b = JC.beginBattle(G, y, x);
  let wantRetreat = false, ev;
  dlg.innerHTML = `<div class="dlg">${pic('standarten')}<h2>Römisches Reich gegen ${t.name}</h2><div class="vs"><div><div class="nm">Rom</div><div class="n" id="bR"></div>${bar(1, 1)}</div><div>⚔</div><div><div class="nm">${t.name}</div><div class="n" id="bG"></div>${bar(1, 1, 'red')}</div></div>
    <p class="hint" id="bMsg">Die Schlacht tobt …</p><div class="btns"><button id="bRet" class="danger">Rückzug</button></div></div>`;
  if (!dlg.open) dlg.showModal();
  $('#bRet').onclick = () => { wantRetreat = true; };
  const show = () => {
    $('#bR').textContent = nf(Math.max(0, b.RO)); $('#bG').textContent = nf(Math.max(0, b.GA));
    dlg.querySelectorAll('.bar i')[0].style.width = Math.max(0, b.RO / b.R * 100) + '%';
    dlg.querySelectorAll('.bar i')[1].style.width = Math.max(0, b.GA / b.G * 100) + '%';
  };
  show();
  for (;;) {
    await new Promise(r => setTimeout(r, 110));
    if (wantRetreat) { ev = JC.retreat(G, b); break; }
    ev = JC.stepBattle(G, b); show();
    if (ev.type === 'round') continue;
    if (ev.type === 'capitulation') {
      const ans = await ask({
        title: 'Kapitulationsangebot',
        html: `<p>Die ${t.name} bieten an:</p><dl><dt>Geiseln</dt><dd>${nf(ev.hostages)}</dd><dt>Denare</dt><dd>${nf(ev.denars)}</dd></dl><p>… und einen Friedensvertrag (jährlicher Tribut 1000).</p>`,
        buttons: [{ label: 'Weiterkämpfen', value: 'fight' }, { label: 'Annehmen', value: 'accept', cls: 'primary' }],
      });
      if (!dlg.open) dlg.showModal();
      if (ans === 'accept') { JC.acceptCapitulation(G, b); ev = { type: 'peace' }; break; }
      b.KA += 1; dlg.innerHTML = ''; battleChrome(t, b); wantRetreat = false; $('#bRet').onclick = () => { wantRetreat = true; }; show(); continue;
    }
    break;
  }
  if (!dlg.open) dlg.showModal();
  let text = '';
  if (ev.type === 'retreat') text = `Rückzug Roms. Davon ${nf(ev.fled)} Mann während des Rückzugs verloren.`;
  if (ev.type === 'flee') text = `Die Römer fliehen! Davon ${nf(ev.fled)} Mann auf der Flucht verloren.`;
  if (ev.type === 'lost') text = 'Die Legion ist aufgerieben. Rom unterliegt.';
  if (ev.type === 'peace') text = `Friede mit den ${t.name}. Tribut 1000 Denare pro Jahr.`;
  let conquest = null;
  if (ev.type === 'conquered') {
    const loot = await askNumber({ title: 'Die Stadt ist erobert!', html: `<p>Beute: bis zu ${nf(ev.maxLoot)} Denare. Mehr als die Hälfte erzürnt die Volksgruppe.</p>`, max: ev.maxLoot, value: Math.floor(ev.maxLoot / 2), label: 'Beute nehmen', unit: 'Denare' });
    const host = await askNumber({ title: 'Geiseln', html: `<p>Gefangene: ${nf(ev.prisoners)}. Mehr als 10 % erzürnt die Volksgruppe. <b>Alle</b> als Geiseln zu nehmen vernichtet den Stamm und verärgert ganz Gallien.</p>`, max: ev.prisoners, value: Math.floor(ev.prisoners / 10), label: 'Geiseln nehmen', unit: 'Personen' });
    conquest = JC.resolveConquest(G, b, loot, host);
    text = conquest.destroyed ? `Die ${t.name} sind vernichtet. Ganz Gallien ist erschüttert.` : `Die ${t.name} sind unterworfen: ${nf(conquest.hostages)} Geiseln, ${nf(conquest.loot)} Denare Beute.`;
  }
  const fin = JC.finishBattle(G, b);
  log(`${ROMAN[y]}. Legion ${b.n ? 'unterliegt' : 'siegt'} bei den ${t.name} (−${nf(fin.lost)} Mann)`);
  await note(b.n ? 'Niederlage' : 'Sieg', `<p>${text}</p><dl><dt>Eigene Verluste</dt><dd>${nf(fin.lost)}</dd><dt>Legion jetzt</dt><dd>${nf(G.legions[y].le)} Mann</dd><dt>Moral</dt><dd>${G.legions[y].mv}/9</dd></dl>`);
  if (G.over === 'win') return await endGame();
  if (G.legions[y].le > 0 || G.rv > 0) {
    const L = G.legions[y];
    const pay = await askNumber({ title: `Sold für die ${ROMAN[y]}. Legion`, html: `<p>Wie viel zahlst du den ${nf(L.le)} Soldaten? (Dein Vermögen: ${nf(G.rv)})</p><p class="hint">Die Moral reagiert auf die Höhe des Solds im Verhältnis zur Stärke.</p>`, max: G.rv, value: Math.min(G.rv, Math.floor(L.le * 1.5)), label: 'Auszahlen', unit: 'Denare' });
    JC.payLegion(G, y, pay);
  }
}
function battleChrome(t, b) {
  dlg.innerHTML = `<div class="dlg">${pic('standarten')}<h2>Römisches Reich gegen ${t.name}</h2><div class="vs"><div><div class="nm">Rom</div><div class="n" id="bR"></div>${bar(1, 1)}</div><div>⚔</div><div><div class="nm">${t.name}</div><div class="n" id="bG"></div>${bar(1, 1, 'red')}</div></div>
    <p class="hint" id="bMsg">Die Schlacht tobt …</p><div class="btns"><button id="bRet" class="danger">Rückzug</button></div></div>`;
  if (!dlg.open) dlg.showModal();
}

/* ---------- Winterlager ---------- */
async function winter() {
  if (busy) return; busy = true; renderSide(); Music.play('winter');
  try {
    if (JC.checkVictory(G)) return await endGame();
    const wa = JC.winterAttack(G);
    if (wa.attackers.length) {
      log(`Winterlager angegriffen von ${wa.attackers.length} Stämmen (Verluste ${wa.size})`);
      await note('Angriff auf das Winterlager', `<p>Folgende Stämme haben die Legionen im Winterlager angegriffen:</p><p><b>${wa.attackers.slice(0, 14).map(i => G.tribes[i].name).join(', ')}${wa.attackers.length > 14 ? ' …' : ''}</b></p><p>Die eigenen Verluste sind <b class="bad">${wa.size}</b> (${nf(wa.loss)} Mann).</p>`, 'Weiter', 'reiter');
    }
    const bud = JC.budget(G);
    const ok = bud.soldiers > 0 && bud.total >= 1;
    await note('Jährlicher Bericht an den Senat', `<p><b>${bud.pacified}</b> der 30 Stämme sind befriedet.</p>
      <dl><dt>Vermögen</dt><dd>${nf(G.rv)}</dd><dt>Tribute</dt><dd>+ ${nf(bud.income)}</dd><dt>Fixkosten (½ Soldaten)</dt><dd>− ${nf(bud.cost)}</dd><dt><b>Gesamt</b></dt><dd><b class="${bud.total < 1 ? 'bad' : 'good'}">${nf(bud.total)}</b></dd></dl>
      ${ok ? '<p>Sie werden für ein weiteres Jahr als Heerführer eingesetzt.</p>' : '<p class="bad">Der Senat entzieht Ihnen das Kommando.</p>'}`, 'Weiter', 'senator');
    JC.closeBudget(G);
    if (G.over === 'lose') return await endGame(bud.soldiers === 0 ? 'Alle Legionen sind vernichtet.' : 'Die Staatskasse ist leer – die Legionen sind nicht mehr zu bezahlen.');
    for (let i = 1; i <= 4; i++) {
      const L = G.legions[i], info = JC.recruitInfo(G, i);
      if (info.full) { JC.recruit(G, i, 0); continue; }
      const n = await askNumber({
        title: `${ROMAN[i]}. Legion · Verstärkung`, img: 'zenturio',
        html: `<dl><dt>Kämpfe / Siege</dt><dd>${L.kl} / ${L.sl}</dd><dt>Veteranen</dt><dd>${nf(L.le)}</dd><dt>Hilfstruppen</dt><dd>${nf(info.hi)}</dd><dt>Moral</dt><dd>${L.mv}/9</dd></dl>
          <p>Es melden sich bis zu <b>${nf(info.maxVolunteers)}</b> Freiwillige (Moral × 250). Platz bis zur Maximalstärke: ${nf(Math.max(0, info.free))}.</p>`,
        max: Math.max(0, Math.min(info.maxVolunteers, info.free)), value: Math.max(0, Math.min(info.maxVolunteers, info.free)), label: 'Rekrutieren', unit: 'Mann',
      });
      JC.recruit(G, i, n);
    }
    save(true);
    JC.nextYear(G); G.vs = 0; sel = 0;
    log('Ein neues Jahr beginnt. Unruhe regt sich in Gallien.');
  } finally { busy = false; renderAll(); if (!G.over) Music.play('map'); }
}

/* ---------- Ende, Speichern, Start ---------- */
async function endGame(reason) {
  busy = true; Music.play(G.over === 'win' ? 'win' : 'lose');
  if (G.over === 'win') {
    await ask({ title: 'Gratulation!', img: 'sieg', html: `<p>Alle 30 Stämme Galliens sind durch Vertrag oder Waffengewalt an Rom gebunden. Nach ${G.year} Jahr(en) ist der Krieg entschieden.</p><p>Der Senat feiert Caesars Triumph.</p>`, buttons: [{ label: 'Neues Spiel', value: true, cls: 'primary' }] });
  } else {
    await ask({ title: 'Kommando entzogen', img: 'senator', html: `<p>${reason || ''}</p><p>Der Statthalter hat es geschafft: Roms Ansehen in Gallien ist ruiniert, und von Caesars Namen bleibt nichts als eine Fußnote.</p>`, buttons: [{ label: 'Neues Spiel', value: true, cls: 'primary' }] });
  }
  busy = false; try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  startMenu();
}
function save(silent) {
  try {
    const { rnd, ...rest } = G; localStorage.setItem(SAVE_KEY, JSON.stringify({ ...rest, actLegion }));
    if (!silent) log('Spielstand gespeichert.');
    return true;
  } catch (e) { if (!silent) note('Speichern nicht möglich', '<p>Der Browser verweigert den lokalen Speicher.</p>'); return false; }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const s = JSON.parse(raw); G = { ...s, rnd: Math.random }; actLegion = s.actLegion || 1; sel = 0; return true;
  } catch (e) { return false; }
}
function begin() { buildMap(); renderAll(); Music.play('map'); }
async function startMenu() {
  Music.play('title');
  let hasSave = false; try { hasSave = !!localStorage.getItem(SAVE_KEY); } catch (e) {}
  const pick = await ask({
    title: 'Julius Caesar · Der Gallische Krieg', img: 'titel',
    html: `<p>Du bist Heerführer Roms. Führe vier Legionen durch Gallien und binde alle 30 Stämme durch Friedens- oder Freundschaftsverträge an Rom – mit Gold, Diplomatie oder Schwert.</p>
      <label class="hint">Spielstärke<select id="sp">${[1, 2, 3, 4, 5].map(i => `<option value="${i}">${i} – ${SP_TEXT[i]}</option>`).join('')}</select></label>
      <p class="hint">Fan-Nachbau nach den Regeln des C64-Klassikers (Kingsoft, 1989), rekonstruiert per Reverse Engineering. Grafik und Code sind neu.</p>`,
    buttons: [{ label: 'Regeln', value: 'help' }, ...(hasSave ? [{ label: 'Spielstand laden', value: 'load' }] : []), { label: 'Neues Spiel', value: d => 'new' + d.querySelector('#sp').value, cls: 'primary' }],
  });
  if (pick === 'help') { await help(); return startMenu(); }
  if (pick === 'load') { if (load()) return begin(); }
  G = JC.createGame(+String(pick).replace('new', '') || 1); sel = 0; actLegion = 1; begin();
  log('Die Legionen stehen bereit.');
}
function help() {
  return note('Regeln in Kürze', `<p><b>Ziel:</b> Alle 30 Stämme brauchen einen Vertrag (Frieden oder Freundschaft).</p>
    <p><b>Jahr:</b> Unruhe (Stärke = Anzahl Stämme/Jahr) senkt die Haltung zu Rom; nur Freunde sind immun. Stämme mit Haltung 0 sind im Krieg, überfallen im Winter deine Legionen und brechen Verträge.</p>
    <p><b>Verhandeln:</b> bis zu 5× pro Jahr, jeden Stamm nur einmal: Geschenke (teuer bei hoher Bevölkerung und Feindseligkeit), Konferenz (ab Haltung 8), Geiseln freilassen, Tribut erlassen oder erhöhen, Freundschaftsvertrag (ab Haltung 11, bringt 1000 Hilfstruppen/Jahr).</p>
    <p><b>Krieg:</b> Wähle Stamm und Legion. Kleine Stämme besiegt eine Legion, bei großen verblutet sie. Nach einem Drittel Verlusten bieten die Gallier Kapitulation an. Eroberung: Beute und Geiseln wählen; zu viel erzürnt die Volksgruppe, ein Stamm wird nur vernichtet, wenn alle zu Geiseln werden. Rückzug jederzeit möglich.</p>
    <p><b>Sold:</b> Nach jedem Kampf bestimmt der Sold die Moral (unter ½ Stärke −2, unter 1,1× −1, über 3,1× +1). Moral × 250 = Freiwillige im Winter.</p>
    <p><b>Winter:</b> Fixkosten = ½ Soldaten. Tribute bringen Einkommen. Sind Geld oder Legionen weg, ist das Spiel verloren.</p>`);
}

const bMusic = $('#bMusic');
function paintMusic() { bMusic.setAttribute('aria-pressed', Music.isEnabled()); bMusic.style.opacity = Music.isEnabled() ? 1 : .45; }
bMusic.onclick = () => { Music.setEnabled(!Music.isEnabled()); paintMusic(); }; paintMusic();
$('#bWinter').onclick = winter;
$('#bSave').onclick = () => { if (G && !busy) { save(false); } };
$('#bNew').onclick = async () => { if (busy) return; const r = await ask({ title: 'Neues Spiel?', html: '<p>Der laufende Fortschritt geht verloren (außer gespeichert).</p>', buttons: [{ label: 'Abbrechen', value: false }, { label: 'Neu beginnen', value: true, cls: 'danger' }] }); if (r) startMenu(); };
$('#bHelp').onclick = () => { if (!busy) help(); };

G = JC.createGame(1); buildMap(); renderAll(); startMenu();
</script>
</body>
</html>
